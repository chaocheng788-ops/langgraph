<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分布式拓扑图</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f172a; min-height: 100vh; padding: 40px 20px;
        }
        .container { max-width: 1400px; margin:0 auto; position: relative; }
        .main-title {
            text-align: center; font-size: 32px; font-weight: 700; color: #e2e8f0;
            margin-bottom: 50px; letter-spacing: 1px;
        }
        .topology { position: relative; min-height: 500px; }
        .node {
            position: absolute; background: rgba(102,126,234,0.9); color: #fff;
            border-radius: 12px; padding: 16px 20px; text-align: center;
            font-size: 14px; font-weight: 600; min-width: 120px;
            box-shadow: 0 4px 16px rgba(102,126,234,0.4);
            transition: transform 0.2s; z-index: 2;
        }
        .node:hover { transform: scale(1.05); }
        .node .node-desc { font-size: 11px; font-weight: 400; opacity: 0.8; margin-top: 4px; }
        .node-source { background: rgba(16,185,129,0.9); box-shadow: 0 4px 16px rgba(16,185,129,0.4); }
        .node-target { background: rgba(244,63,94,0.9); box-shadow: 0 4px 16px rgba(244,63,94,0.4); }
        .node-middle { background: rgba(245,158,11,0.9); box-shadow: 0 4px 16px rgba(245,158,11,0.4); }
        .arrow {
            position: absolute; height: 2px; background: #4b5563;
            transform-origin: left center; z-index: 1;
        }
        .arrow::after {
            content: ''; position: absolute; right: -6px; top: -4px;
            width: 0; height: 0;
            border-left: 8px solid #4b5563;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }
        .footer-note {
            text-align: center; margin-top: 50px; font-size: 12px; color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-title">分布式系统拓扑图</div>
        <div class="topology">
            <!-- 替换为实际节点，用绝对定位坐标 -->
            <div class="node node-source" style="left:50px; top:50px;">
                上游服务
                <div class="node-desc">数据源/入口</div>
            </div>
            <div class="node node-middle" style="left:350px; top:150px;">
                中间处理层
                <div class="node-desc">消息队列/计算</div>
            </div>
            <div class="node node-target" style="left:650px; top:50px;">
                下游服务
                <div class="node-desc">消费端/存储</div>
            </div>
            <!-- 替换连线箭头 -->
            <div class="arrow" style="left:190px; top:75px; width:160px; transform:rotate(15deg);"></div>
            <div class="arrow" style="left:490px; top:175px; width:160px; transform:rotate(-15deg);"></div>
        </div>
        <div class="footer-note">基于公开行业信息梳理的通用架构</div>
    </div>
</body>
</html>
