                                                当前: {selectedModel || '未选择模型'}
                                                {activeSkillCount > 0 ? ` · ${activeSkillCount} 个技能` : ''}
                                            </span>
                                        </p>
                                    </div>
                                )}
                                {/* ── 消息列表渲染 ── */}
                                {chatMessages.map((msg, i) => {
                                    const isThinking = msg.role === 'thinking';  // 思考中动画
                                    const cls = msg.role === 'user' ? 'user' : msg.role === 'tool' ? 'tool' : msg.role === 'tool-start' ? 'tool-start' : isThinking ? 'thinking' : 'assistant';
                                    const label = msg.role === 'user' ? '你' : msg.role === 'tool' ? `工具 (${msg.name || ''})` : msg.role === 'tool-start' ? '工具调用' : isThinking ? '' : 'AI';
                                    return (
                                    <div key={i} className={`msg ${cls}`}>
                                        {!isThinking && <div className="msg-label">{label}</div>}
                                        <div className="msg-bubble">{msg.content}</div>
                                    </div>
                                    );
                                })}
                                <div ref={chatEndRef} />  {/* 自动滚动锚点 */}
                            </div>

                            {/* ── 底部输入区：模型选择器 + 工具标签 + 输入框 + 运行按钮 ── */}
                            <div className="chat-input-area">
                                <div style={{ display: 'flex', gap: '8px', marginBottom: '10px', flexWrap: 'wrap', alignItems: 'center' }}>
                                    <span style={{ fontSize: '11px', color: '#64748b', fontWeight: 600 }}>模型:</span>
                                    <select style={{ padding: '5px 12px', border: '1.5px solid #e2e8f0', borderRadius: '8px', background: '#fff', color: '#1e293b', fontSize: '12px', cursor: 'pointer', fontWeight: 500, outline: 'none' }}
                                        value={selectedModelName}
                                        onChange={e => selectModel(e.target.value)}>
                                        <option value="">-- 请选择模型 --</option>
                                        {modelList.map(m => (
                                            <option key={m.name} value={m.name}>{m.name} ({m.model_name})</option>
                                        ))}
                                    </select>
                                    <span style={{ fontSize: '11px', color: '#64748b', marginLeft: '6px', fontWeight: 600 }}>技能:</span>
                                    {activeSkillCount === 0
                                        ? <span style={{ fontSize: '11px', color: '#94a3b8' }}>未开启</span>
                                        : enabledSkills.map(([name]) => (
                                            <span key={name} style={{ fontSize: '11px', padding: '3px 10px', background: '#eef2ff', borderRadius: '8px', color: '#667eea', fontWeight: 600 }}>{name}</span>
                                        ))
                                    }
                                </div>
                                <div className="chat-input-row">
                                    <textarea
                                        value={chatInput}
                                        onChange={e => setChatInput(e.target.value)}
                                        onKeyDown={handleKeyDown}
                                        placeholder={running ? '运行中...' : '输入你的问题... (Enter 发送, Shift+Enter 换行)'}
                                        disabled={running}
                                        rows={2}
                                    />
                                    <button className="chat-run-btn" onClick={runAgent} disabled={running || !chatInput.trim()}>
                                        {running ? '⏳ 运行中' : '▶ 运行'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* ══════════════════ LOG DRAWER — 可拖拽执行日志 ══════════════════ */}
                    {logOpen && (
                        <div style={{ position: 'fixed', top: 0, right: 0, bottom: 0, width: `${logWidth}px`, background: '#fff', borderLeft: '1.5px solid #e2e8f0', zIndex: 100, display: 'flex', flexDirection: 'column', boxShadow: '-8px 0 32px rgba(0,0,0,0.1)', transition: draggingRef.current ? 'none' : 'width 0.15s ease' }}>
                            {/* ── 左侧拖拽手柄 ── */}
                            <div
                                onMouseDown={onDragStart}
                                style={{
                                    position: 'absolute', left: 0, top: 0, bottom: 0,
                                    width: '6px', cursor: 'col-resize', zIndex: 10,
                                    background: 'transparent',
                                }}
                                title="拖拽调整宽度"
                            />
                            {/* ── 标题栏 ── */}
                            <div style={{ padding: '14px 20px', borderBottom: '1.5px solid #e2e8f0', display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#f8fafc' }}>
                                <span style={{ fontWeight: 700, fontSize: '14px', color: '#1e293b' }}>📋 执行日志</span>
                                <button className="btn btn-sm" style={{ background: '#e2e8f0', color: '#475569' }}
                                    onClick={() => setLogOpen(false)}>✕ 关闭</button>
                            </div>
                            {/* ── 日志内容区域 ── */}
                            <div style={{ flex: 1, overflowY: 'auto', padding: '14px 18px', fontFamily: 'monospace', fontSize: '12px', lineHeight: '1.8', background: '#fafbfc' }}>
                                {/* 空状态 */}
                                {logs.length === 0 && (
                                    <div style={{ color: '#94a3b8', textAlign: 'center', padding: '40px 0' }}>
                                        <div style={{ fontSize: '28px', marginBottom: '10px' }}>📭</div>
                                        <div style={{ fontWeight: 600 }}>暂无日志</div>
                                        <div style={{ fontSize: '11px', marginTop: '6px' }}>运行 Agent 后将显示详细执行步骤</div>
                                    </div>
                                )}
                                {/* 逐条日志渲染 */}
                                {logs.map((log, i) => (
                                    <div key={i} style={{
                                        padding: '8px 10px', marginBottom: '6px', borderRadius: '8px',
                                        background: log.level === 'error' ? '#fef2f2' : '#fff',
                                        border: `1.5px solid ${log.level === 'error' ? '#fecaca' : '#e2e8f0'}`,
                                        borderLeft: `4px solid ${log.level === 'error' ? '#dc2626' : log.step.includes('失败') ? '#dc2626' : '#667eea'}`,
                                        boxShadow: '0 1px 3px rgba(0,0,0,0.03)',
                                    }}>
                                        {/* ── 日志头部：时间戳 + 步骤名 ── */}
                                        <div style={{ display: 'flex', gap: '10px', color: '#94a3b8', fontSize: '10px', fontWeight: 600 }}>
                                            <span>{log.timestamp || ''}</span>
                                            <span style={{ color: log.level === 'error' ? '#dc2626' : '#667eea' }}>{log.step}</span>
                                        </div>
                                        {/* ── 日志详情（自动检测 JSON 并高亮） ── */}
                                        <LogDetail text={log.detail} />
                                    </div>
                                ))}
                                <div ref={logEndRef} />  {/* 自动滚动锚点 */}
                            </div>
                        </div>
                    )}

                    {/* ══════════════════ Toast ══════════════════ */}
                    <Toast msg={toast.msg} show={toast.show} />
                </div>
            );
        }

        // ── 将 App 组件挂载到 #root 根节点 ──
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
