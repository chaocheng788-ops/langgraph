<!DOCTYPE html>
<html lang="zh-CN">

    <style>

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: #334155; margin-bottom: 4px; font-weight: 600; letter-spacing: 0.3px; }
        .form-control { width: 100%; padding: 8px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; background: #f8fafc; color: #0f172a; font-size: 13px; transition: all 0.2s; outline: none; }
        .form-control:focus { border-color: #667eea; background: #fff; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .form-control::placeholder { color: #94a3b8; }

        .btn { padding: 7px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; letter-spacing: 0.3px; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; box-shadow: 0 2px 8px rgba(102,126,234,0.35); }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(102,126,234,0.45); }
        .btn-danger { background: linear-gradient(135deg, #f43f5e, #e11d48); color: #fff; box-shadow: 0 2px 8px rgba(244,63,94,0.3); }
        .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(244,63,94,0.4); }
        .btn-sm { padding: 5px 12px; font-size: 11px; border-radius: 6px; }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: #fff; box-shadow: 0 2px 8px rgba(16,185,129,0.3); }

        .msg.tool-start .msg-bubble { background: #eef2ff; border: 1.5px solid #a5b4fc; color: #4338ca; font-size: 12px; border-radius: 10px; font-weight: 500; }
        .msg.thinking .msg-bubble { background: #f8fafc; border: 1.5px dashed #cbd5e1; color: #94a3b8; font-size: 12px; border-radius: 10px; font-style: italic; animation: pulse 1.5s ease-in-out infinite; }

        .diagram-container { margin-top: 12px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.1); border: 2px solid #e2e8f0; }

        .params-header .pn { width: 90px; }
        .params-header .pt { width: 70px; }
        .params-header .pd { flex: 1; }
        .params-header .pr { width: 50px; text-align: center; }

        .status-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: 600; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }

        .conv-list { display: flex; flex-direction: column; gap: 6px; }

        .conv-item:hover { border-color: #a5b4fc; box-shadow: 0 2px 8px rgba(102,126,234,0.08); }
        .conv-item.active { border-color: #667eea; background: #eef2ff; }
        .conv-item-title { font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 24px; }
        .conv-item.active .conv-item-title { color: #4338ca; }
        .conv-item-meta { font-size: 11px; color: #64748b; display: flex; gap: 10px; }
        .conv-item-delete { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 6px; border: none; background: transparent; color: #94a3b8; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: all 0.2s; }
        .conv-item:hover .conv-item-delete { opacity: 1; }
        .conv-item-delete:hover { background: #fef2f2; color: #ef4444; }

        .history-dropdown { position: absolute; top: 100%; right: 0; margin-top: 8px; width: 340px; max-height: 420px; background: #fff; border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.15); z-index: 100; overflow: hidden; display: flex; flex-direction: column; }
        .history-dropdown-header { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; font-size: 13px; font-weight: 600; color: #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .history-dropdown-list { flex: 1; overflow-y: auto; padding: 8px; }

        .log-detail { color: #1e293b; font-size: 12px; margin-top: 2px; word-break: break-all; white-space: pre-wrap; line-height: 1.6; }
        .json-block { background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 10px 12px; margin: 4px 0; overflow-x: auto; font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; font-size: 12px; line-height: 1.6; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
        .json-key { color: #93c5fd; }
        .json-string { color: #86efac; }
        .json-number { color: #fda4af; }
        .json-bool { color: #c4b5fd; }
        .json-null { color: #94a3b8; }
        .json-brace { color: #fde68a; }

        /* ── 架构图表单样式 ── */
        .arch-form-container { background: #fff; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-top: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .arch-form-title { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
        .arch-form-desc { font-size: 12px; color: #64748b; margin-bottom: 16px; }
        .arch-form-field { margin-bottom: 14px; }
        .arch-form-field label { display: block; font-size: 12px; color: #334155; margin-bottom: 5px; font-weight: 600; }
        .arch-form-field input[type="text"],
        .arch-form-field select { width: 100%; padding: 9px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; background: #f8fafc; color: #0f172a; font-size: 13px; outline: none; transition: all 0.2s; font-family: inherit; }
        .arch-form-field input[type="text"]:focus,
        .arch-form-field select:focus { border-color: #667eea; background: #fff; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .arch-form-field input::placeholder { color: #94a3b8; }
        .arch-form-submit { width: 100%; padding: 10px 0; border: none; border-radius: 10px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.25s; box-shadow: 0 4px 14px rgba(102,126,234,0.35); letter-spacing: 0.5px; }
        .arch-form-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(102,126,234,0.45); }
        .arch-form-required { color: #ef4444; margin-left: 2px; }

        @media (max-width: 768px) { .sidebar { width: 280px; } }

</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const API_BASE = '/api';

        async function api(path, options = {}) {
            const res = await fetch(`${API_BASE}${path}`, { headers: { 'Content-Type': 'application/json' }, ...options });
            if (!res.ok) { const err = await res.json().catch(() => ({ detail: res.statusText })); throw new Error(err.detail || `HTTP ${res.status}`); }
            return res.json();
        }

        function Toast({ msg, show }) { return <div className={`toast ${show ? 'show' : ''}`}>{msg}</div>; }

        function highlightJSON(jsonStr) {
            return jsonStr.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/("(?:[^"\\]|\\.)*")\s*:/g, '<span class="json-key">$1</span>:').replace(/:\s*("(?:[^"\\]|\\.)*")/g, ': <span class="json-string">$1</span>').replace(/:\s*(\d+\.?\d*)/g, ': <span class="json-number">$1</span>').replace(/:\s*(true|false)/g, ': <span class="json-bool">$1</span>').replace(/:\s*(null)/g, ': <span class="json-null">$1</span>').replace(/([\[\]{}])/g, '<span class="json-brace">$1</span>');
        }

        function parseFormJSON(content) {
            const jsonMatch = content.match(/```json\s*\n([\s\S]*?)\n```/);
            if (!jsonMatch) return null;
            try {
                const parsed = JSON.parse(jsonMatch[1]);
                if (parsed.form_type === 'architecture_diagram_config') return parsed;
                return null;
            } catch { return null; }
        }

        function stripFormJSON(content) {
            return content.replace(/```json\s*\n[\s\S]*?```/, '').trim();
        }

        function ArchDiagramForm({ formData, onSubmit }) {
            const [values, setValues] = React.useState(() => {
                const init = {};
                Object.entries(formData.fields).forEach(([key, field]) => {
                    init[key] = field.value || field.default || '';
                });
                return init;
            });

            const handleSubmit = (e) => {
                e.preventDefault();
                const productName = values.product_name || '';
                if (!productName.trim()) return;
                const archTypeMap = { product_arch: '产品分层架构', microservice: '微服务架构', topology: '分布式拓扑' };
                const styleMap = { business: '商务极简风', dark_tech: '深色科技风' };
                const archType = archTypeMap[values.arch_type] || values.arch_type || '产品分层架构';
                const modules = values.modules ? '，核心模块包括' + values.modules : '';
                const style = styleMap[values.visual_style] || values.visual_style || '商务极简风';
                const message = '为【' + productName + '】生成' + archType + '图' + modules + '，使用' + style + '风格';
                onSubmit(message);
            };

            const fields = formData.fields || {};
            return React.createElement('div', { className: 'arch-form-container' },
                React.createElement('div', { className: 'arch-form-title' }, formData.title || '配置表单'),
                formData.description ? React.createElement('div', { className: 'arch-form-desc' }, formData.description) : null,
                React.createElement('form', { onSubmit: handleSubmit },
                    Object.entries(fields).map(([key, field]) =>
                        React.createElement('div', { key: key, className: 'arch-form-field' },
                            React.createElement('label', null, field.label, field.required ? React.createElement('span', { className: 'arch-form-required' }, '*') : null),
                            field.type === 'select'
                                ? React.createElement('select', {
                                    value: values[key],
                                    onChange: e => setValues({ ...values, [key]: e.target.value })
                                }, (field.options || []).map(opt =>
                                    React.createElement('option', { key: opt.value, value: opt.value }, opt.label)
                                ))
                                : React.createElement('input', {
                                    type: 'text',
                                    value: values[key],
                                    onChange: e => setValues({ ...values, [key]: e.target.value }),
                                    placeholder: field.placeholder || ''
                                })
                        )
                    ),
                    React.createElement('button', {
                        type: 'submit',
                        className: 'arch-form-submit',
                        disabled: !values.product_name?.trim()
                    }, '✅ 生成架构图')
                )
            );
        }

        function LogDetail({ text }) {
            const parts = [], lines = text.split('\n');
            let buffer = [], inJSON = false, braceDepth = 0;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i], trimmed = line.trim();
                if (!inJSON && (trimmed.startsWith('{') || (trimmed.startsWith('[') && /^\[\s*("|\{|\[|\d|true|false|null)/.test(trimmed)))) {
                    if (buffer.length > 0) { parts.push({ type: 'text', content: buffer.join('\n') }); buffer = []; }
                    inJSON = true; braceDepth = 0;
                }
                if (inJSON) {
                    buffer.push(line);
                    for (const ch of trimmed) { if (ch === '{' || ch === '[') braceDepth++; if (ch === '}' || ch === ']') braceDepth--; }
                    if (braceDepth === 0 && buffer.length > 1) {
                        const jsonStr = buffer.join('\n');
                        try { parts.push({ type: 'json', content: JSON.stringify(JSON.parse(jsonStr), null, 2) }); } catch { parts.push({ type: 'text', content: jsonStr }); }
                        buffer = []; inJSON = false;
                    }
                } else { buffer.push(line); }
            }
            if (buffer.length > 0) parts.push({ type: inJSON ? 'json' : 'text', content: buffer.join('\n') });
            if (parts.length === 0) return <div className="log-detail">{text}</div>;
            return <div>{parts.map((p, idx) => p.type === 'json' ? <div key={idx} className="json-block" dangerouslySetInnerHTML={{ __html: highlightJSON(p.content) }} /> : <div key={idx} className="log-detail">{p.content}</div>)}</div>;
        }

        function App() {
            const [tab, setTab] = useState('models');
            const [models, setModels] = useState({});
            const [skills, setSkills] = useState({});
            const [skillEnabled, setSkillEnabled] = useState({});
            const [prompt, setPrompt] = useState('');
            const [toast, setToast] = useState({ msg: '', show: false });
            const [editingModel, setEditingModel] = useState(null);
            const [editingSkill, setEditingSkill] = useState(null);
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [running, setRunning] = useState(false);
            const [selectedModel, setSelectedModel] = useState('');
            const [selectedModelName, setSelectedModelName] = useState('');
            const [selectedApiKey, setSelectedApiKey] = useState('');
            const [selectedBaseUrl, setSelectedBaseUrl] = useState('https://dashscope.aliyuncs.com/compatible-mode/v1');
            const [logs, setLogs] = useState([]);
            const [logOpen, setLogOpen] = useState(false);
            const [logWidth, setLogWidth] = useState(440);
            const [threadId, setThreadId] = useState(() => 'session-' + Math.random().toString(36).slice(2, 10));
            const [conversations, setConversations] = useState([]);
            const [loadingConversation, setLoadingConversation] = useState(false);
            const [historyOpen, setHistoryOpen] = useState(false);
            const draggingRef = useRef(false);
            const chatEndRef = useRef(null);
            const logEndRef = useRef(null);

            const showToast = useCallback((msg) => { setToast({ msg, show: true }); setTimeout(() => setToast({ msg: '', show: false }), 2500); }, []);
            const loadConversations = useCallback(async () => { try { const d = await api('/conversations'); setConversations(d.conversations || []); } catch {} }, []);
            const loadConversation = useCallback(async (tid) => {
                if (tid === threadId && chatMessages.length > 0) return;
                setLoadingConversation(true);
                try {
                    const data = await api(`/conversations/${encodeURIComponent(tid)}`);
                    const msgs = data.messages || [];
                    const formatted = [];
                    for (const m of msgs) {
                        const role = m.role === 'human' ? 'user' : m.role === 'ai' ? 'assistant' : m.role;
                        if (role === 'tool') continue;
                        if (role === 'assistant' && m.tool_calls && m.tool_calls.length > 0) {
                            for (const tc of m.tool_calls) {
                                const tcName = tc.name || tc.function?.name || '?';
                                formatted.push({ role: 'tool-start', content: tcName, name: tcName, _completed: true });
                            }
                        }
                        if (m.content && m.content.trim()) formatted.push({ role, content: m.content });
                    }
                    setChatMessages(formatted); setLogs([]); setThreadId(tid);
                } catch (err) { showToast('❌ 加载对话失败: ' + err.message); }
                setLoadingConversation(false);
            }, [threadId, chatMessages, showToast]);

            const deleteConversation = useCallback(async (tid, e) => {
                e.stopPropagation();
                if (!confirm('确定要删除这个对话吗？')) return;
                try { await api(`/conversations/${encodeURIComponent(tid)}`, { method: 'DELETE' }); showToast('🗑️ 对话已删除'); if (tid === threadId) { setChatMessages([]); setLogs([]); setThreadId('session-' + Math.random().toString(36).slice(2, 10)); } await loadConversations(); } catch (err) { showToast('❌ 删除失败: ' + err.message); }
            }, [threadId, showToast, loadConversations]);

            useEffect(() => {
                api('/models').then(data => { setModels(data); const p = Object.entries(data).find(([_, m]) => m.model_name === 'deepseek-v4-pro'); const f = p || Object.entries(data)[0]; if (f) { const [n, m] = f; setSelectedModelName(n); setSelectedModel(m.model_name); setSelectedApiKey(m.api_key || ''); setSelectedBaseUrl(m.base_url || 'https://dashscope.aliyuncs.com/compatible-mode/v1'); } }).catch(() => {});
                api('/skills').then(s => { setSkills(s); const a = {}; Object.keys(s).forEach(k => a[k] = true); setSkillEnabled(a); }).catch(() => {});
                api('/prompt').then(d => setPrompt(d.content)).catch(() => {});
                loadConversations();
            }, []);
            useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatMessages]);
            useEffect(() => { logEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [logs]);

            const onDragStart = useCallback((e) => { e.preventDefault(); draggingRef.current = true; const sx = e.clientX, sw = logWidth; const mv = (ev) => { if (!draggingRef.current) return; setLogWidth(Math.min(900, Math.max(280, sw + (sx - ev.clientX)))); }; const up = () => { draggingRef.current = false; document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); document.body.style.cursor = ''; document.body.style.userSelect = ''; }; document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up); document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none'; }, [logWidth]);

            const saveModel = useCallback(async (m) => { try { await api('/models', { method: 'POST', body: JSON.stringify(m) }); setModels(await api('/models')); setEditingModel(null); showToast('✅ 模型已保存'); } catch (err) { showToast('❌ ' + err.message); } }, [showToast]);
            const deleteModel = useCallback(async (name) => { try { await api(`/models/${encodeURIComponent(name)}`, { method: 'DELETE' }); setModels(await api('/models')); if (selectedModel === name) { setSelectedModel(''); setSelectedApiKey(''); } showToast('🗑️ 模型已删除'); } catch (err) { showToast('❌ ' + err.message); } }, [showToast, selectedModel]);
            const saveSkill = useCallback(async (s) => { try { await api('/skills', { method: 'POST', body: JSON.stringify(s) }); setSkills(await api('/skills')); setSkillEnabled({}); setEditingSkill(null); showToast('✅ 技能已保存'); } catch (err) { showToast('❌ ' + err.message); } }, [showToast]);
            const deleteSkill = useCallback(async (name) => { try { await api(`/skills/${encodeURIComponent(name)}`, { method: 'DELETE' }); setSkills(await api('/skills')); setSkillEnabled({}); showToast('🗑️ 技能已删除'); } catch (err) { showToast('❌ ' + err.message); } }, [showToast]);
            const savePrompt = useCallback(async () => { try { await api('/prompt', { method: 'POST', body: JSON.stringify({ content: prompt }) }); showToast('✅ 提示词已保存'); } catch (err) { showToast('❌ ' + err.message); } }, [prompt, showToast]);

            const runAgent = useCallback(async (inputOverride) => {
                const input = inputOverride !== undefined ? inputOverride : chatInput;
                if (!input.trim()) return;
                const userMsg = { role: 'user', content: input };
                setChatMessages(prev => [...prev, userMsg]); setChatInput(''); setRunning(true); setLogOpen(true);
                const thinkingKey = Date.now();
                setChatMessages(prev => [...prev, { role: 'thinking', content: '⏳ 思考中...', _key: thinkingKey }]);
                try {
                    const response = await fetch(`${API_BASE}/run-stream`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model_name: selectedModel, api_key: selectedApiKey, base_url: selectedBaseUrl, system_prompt: prompt, skills: enabledSkills.map(([n]) => n), max_iterations: 10, input: userMsg.content, thread_id: threadId }) });
                    if (!response.ok) { const t = await response.text(); throw new Error(t || `HTTP ${response.status}`); }
                    const reader = response.body.getReader(), decoder = new TextDecoder();
                    let buffer = '';
                    while (true) {
                        const { done, value } = await reader.read(); if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const parts = buffer.split('\n\n'); buffer = parts.pop();
                        for (const part of parts) {
                            const lines = part.split('\n');
                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    try {
                                        const evt = JSON.parse(line.slice(6));
                                        if (evt.type === 'log') { setLogs(prev => [...prev, { step: evt.step, detail: evt.detail, level: evt.level, timestamp: evt.timestamp }]); }
                                        else if (evt.type === 'msg') {
                                            setChatMessages(prev => {
                                                const filtered = prev.filter(m => m.role !== 'thinking');
                                                if (evt.role === 'tool') {
                                                    let previewUrl = null;
                                                    try { const o = JSON.parse(evt.content); if (o.preview_url) previewUrl = o.preview_url; } catch {}
                                                    const updated = filtered.map(m => { if (m.role === 'tool-start' && m.name === evt.name && !m._completed) return { ...m, _completed: true, _previewUrl: previewUrl }; return m; });
                                                    return [...updated, { role: 'thinking', content: '⏳ 思考中...', _key: Date.now() }];
                                                }
                                                const autoCompleted = filtered.map(m => { if (m.role === 'tool-start' && !m._completed) return { ...m, _completed: true }; return m; });
                                                return [...autoCompleted, { role: evt.role, content: evt.content, name: evt.name }];
                                            });
                                        } else if (evt.type === 'done') { if (evt.thread_id) setThreadId(evt.thread_id); }
                                        else if (evt.type === 'error') { setChatMessages(prev => { const f = prev.filter(m => m._key !== thinkingKey); return [...f, { role: 'assistant', content: `❌ 错误: ${evt.message}` }]; }); }
                                    } catch {}
                                }
                            }
                        }
                    }
                    setChatMessages(prev => prev.filter(m => m._key !== thinkingKey));
                } catch (err) { setChatMessages(prev => { const f = prev.filter(m => m._key !== thinkingKey); return [...f, { role: 'assistant', content: `❌ 错误: ${err.message}` }]; }); }
                setRunning(false); loadConversations();
            }, [chatInput, selectedModel, selectedApiKey, prompt, selectedTools, threadId, loadConversations, enabledSkills]);

            const handleKeyDown = useCallback((e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runAgent(); } }, [runAgent]);
            const selectModel = useCallback((name) => { setSelectedModelName(name); if (!name) { setSelectedModel(''); setSelectedApiKey(''); setSelectedBaseUrl('https://dashscope.aliyuncs.com/compatible-mode/v1'); } else { const m = models[name]; if (m) { setSelectedModel(m.model_name); setSelectedApiKey(m.api_key || ''); setSelectedBaseUrl(m.base_url || 'https://dashscope.aliyuncs.com/compatible-mode/v1'); } } }, [models]);
            const toggleSkill = useCallback((sn) => { setSkillEnabled(prev => ({ ...prev, [sn]: !prev[sn] })); }, []);

            const enabledSkills = Object.entries(skills).filter(([n]) => skillEnabled[n]);
            const activeSkillCount = enabledSkills.length;
            const selectedTools = enabledSkills.flatMap(([n, s]) => (s.tools || []).map(t => { const tool = { name: t.name, description: t.description, parameters: t.parameters_schema || t.parameters }; if (t.url) { tool.url = t.url; tool.method = t.method || 'GET'; tool.headers = t.headers || {}; } return tool; }));
            const modelList = Object.values(models), skillList = Object.values(skills);

            return (
                <div style={{ height: '100vh', display: 'flex', flexDirection: 'column' }}>
                    <header className="header">
                        <div style={{ display: 'flex', alignItems: 'center' }}><h1>🤖 LangGraph Agent</h1><span className="header-subtitle">配置 · 管理 · 运行</span></div>
                        <div style={{ display: 'flex', gap: '10px', alignItems: 'center', fontSize: '12px' }}>
                            <span style={{ color: 'rgba(255,255,255,0.9)', fontWeight: 600 }}>模型: {selectedModel ? (selectedModelName || selectedModel) : '未选择'}</span>
                            {activeSkillCount > 0 && <span className="status-badge">{activeSkillCount} 个技能</span>}
                            <button className="btn btn-sm" style={{ background: 'rgba(255,255,255,0.15)', color: '#fff', backdropFilter: 'blur(4px)' }} onClick={() => { setChatMessages([]); setLogs([]); setThreadId('session-' + Math.random().toString(36).slice(2, 10)); }} title="新建会话">🆕 新会话</button>
                            <div style={{ position: 'relative' }}>
                                <button className="btn btn-sm" style={{ background: historyOpen ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.15)', color: '#fff', backdropFilter: 'blur(4px)' }} onClick={() => { setHistoryOpen(!historyOpen); if (!historyOpen) loadConversations(); }} title="历史对话">💬 历史</button>
                                {historyOpen && (<><div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, zIndex: 99 }} onClick={() => setHistoryOpen(false)} /><div className="history-dropdown"><div className="history-dropdown-header"><span>历史对话 · {conversations.length} 个</span><button className="btn btn-sm" style={{ background: '#f1f5f9', color: '#475569', fontSize: '10px' }} onClick={() => setHistoryOpen(false)}>✕</button></div><div className="history-dropdown-list">{loadingConversation && <div className="empty-state" style={{ padding: '16px' }}><div>⏳ 加载中...</div></div>}{conversations.length === 0 && !loadingConversation && <div className="empty-state"><div style={{ fontSize: '13px' }}>暂无历史对话</div><div style={{ marginTop: '4px', fontSize: '11px' }}>发送消息后自动生成</div></div>}<div className="conv-list">{conversations.map(conv => (<div key={conv.thread_id} className={`conv-item ${conv.thread_id === threadId ? 'active' : ''}`} onClick={() => { loadConversation(conv.thread_id); setHistoryOpen(false); }}><div className="conv-item-title">{conv.title}</div><div className="conv-item-meta"><span>{conv.msg_count} 条消息</span>{conv.created_at && <span>{conv.created_at.slice(0, 16).replace('T', ' ')}</span>}</div><button className="conv-item-delete" onClick={(e) => deleteConversation(conv.thread_id, e)} title="删除对话">✕</button></div>))}</div></div></div></>)}
                            </div>
                            <button className="btn btn-sm" style={{ background: logOpen ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.15)', color: '#fff', marginLeft: '4px', backdropFilter: 'blur(4px)' }} onClick={() => setLogOpen(!logOpen)}>📋 日志</button>
                        </div>
                    </header>
                    <div className="layout">
                        <div className="sidebar">
                            <div className="sidebar-tabs"><div className={`sidebar-tab ${tab === 'models' ? 'active' : ''}`} onClick={() => setTab('models')}><span className="icon">🧠</span> 模型</div><div className={`sidebar-tab ${tab === 'skills' ? 'active' : ''}`} onClick={() => setTab('skills')}><span className="icon">🛠️</span> 技能</div><div className={`sidebar-tab ${tab === 'prompt' ? 'active' : ''}`} onClick={() => setTab('prompt')}><span className="icon">📝</span> 提示词</div></div>
                            <div className="sidebar-content">
                                {tab === 'models' && (<div><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}><span style={{ fontSize: '12px', color: '#64748b', fontWeight: 600 }}>大模型配置</span><button className="btn btn-primary btn-sm" onClick={() => setEditingModel({ name: '', model_name: 'deepseek-v4-pro', api_key: '', base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1', temperature: 0.7, max_tokens: 4096, _existing: false })}>+ 新增</button></div>{modelList.length === 0 && <div className="empty-state"><div className="big-icon">🧠</div><div>暂无模型配置</div><div style={{ marginTop: '6px', fontSize: '11px' }}>点击上方「新增」添加模型</div></div>}{modelList.map(m => (<div key={m.name} className={`config-item ${selectedModelName === m.name ? 'selected' : ''}`}><div className="config-item-header"><div style={{ flex: 1 }} onClick={() => selectModel(m.name)}><span className="config-item-name">{m.name}</span><div className="config-item-desc">{m.model_name}</div></div><div className="config-item-actions"><button className="btn btn-sm" style={{ background: '#f1f5f9', color: '#475569' }} onClick={(e) => { e.stopPropagation(); setEditingModel({ ...m, _existing: true }); }}>编辑</button><button className="btn btn-sm btn-danger" onClick={(e) => { e.stopPropagation(); deleteModel(m.name); }}>删除</button></div></div></div>))}{editingModel && (<div className="config-detail"><div className="config-detail-title">{editingModel.name ? '编辑模型' : '新增模型'}</div><div className="form-group"><label>名称</label><input className="form-control" value={editingModel.name} onChange={e => setEditingModel({ ...editingModel, name: e.target.value })} placeholder="例如: deepseek-1" disabled={editingModel._existing} /></div><div className="form-group"><label>模型</label><select className="form-control" value={editingModel.model_name} onChange={e => setEditingModel({ ...editingModel, model_name: e.target.value })}><option value="deepseek-v4-flash">DeepSeek V4 Flash</option><option value="deepseek-v4-pro">DeepSeek V4 Pro</option></select></div><div className="form-group"><label>API Key</label><input className="form-control" type="password" value={editingModel.api_key} onChange={e => setEditingModel({ ...editingModel, api_key: e.target.value })} placeholder="sk-xxxxxxxxxxxxxxxx" /></div><div className="form-group"><label>API 地址 (base_url)</label><input className="form-control" value={editingModel.base_url || 'https://dashscope.aliyuncs.com/compatible-mode/v1'} onChange={e => setEditingModel({ ...editingModel, base_url: e.target.value })} placeholder="https://dashscope.aliyuncs.com/compatible-mode/v1" /></div><div className="form-group"><label>Temperature ({editingModel.temperature})</label><input className="form-control" type="range" min="0" max="2" step="0.1" value={editingModel.temperature} onChange={e => setEditingModel({ ...editingModel, temperature: parseFloat(e.target.value) })} /></div><div className="btn-group"><button className="btn btn-sm" style={{ background: '#f1f5f9', color: '#475569' }} onClick={() => setEditingModel(null)}>取消</button><button className="btn btn-primary btn-sm" onClick={() => saveModel(editingModel)} disabled={!editingModel.name}>保存</button></div></div>)}</div>)}
                                {tab === 'skills' && (<div><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}><span style={{ fontSize: '12px', color: '#64748b', fontWeight: 600 }}>技能配置</span><button className="btn btn-primary btn-sm" onClick={() => setEditingSkill({ name: '', description: '', tools: [], prompt: '', _existing: false })}>+ 新增</button></div>{skillList.length === 0 && <div className="empty-state"><div className="big-icon">🛠️</div><div>暂无技能配置</div><div style={{ marginTop: '6px', fontSize: '11px' }}>点击上方「新增」添加技能</div></div>}{skillList.map(s => { const isOn = !!skillEnabled[s.name]; const toolCount = (s.tools || []).length; return (<div key={s.name} className={`config-item ${isOn ? 'selected' : ''}`}><div className="config-item-header"><div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}><div onClick={() => toggleSkill(s.name)} style={{ width: '34px', height: '20px', borderRadius: '10px', background: isOn ? '#667eea' : '#cbd5e1', position: 'relative', cursor: 'pointer', transition: 'all 0.2s', flexShrink: 0 }}><div style={{ width: '16px', height: '16px', borderRadius: '50%', background: 'white', position: 'absolute', top: '2px', left: isOn ? '16px' : '2px', transition: 'all 0.2s', boxShadow: '0 1px 3px rgba(0,0,0,0.15)' }} /></div><div><span className="config-item-name">{s.name}</span><div className="config-item-desc">{s.description || '无描述'} · {toolCount} 个工具</div></div></div><div className="config-item-actions"><button className="btn btn-sm" style={{ background: '#f1f5f9', color: '#475569' }} onClick={(e) => { e.stopPropagation(); setEditingSkill({ ...s, _existing: true }); }}>编辑</button><button className="btn btn-sm btn-danger" style={{ background: '#fee2e2', color: '#dc2626' }} onClick={(e) => { e.stopPropagation(); deleteSkill(s.name); }}>删除</button></div></div></div>); })}{editingSkill && (<div className="config-detail"><div className="config-detail-title">{editingSkill.name ? '编辑技能' : '新增技能'}</div><div className="form-group"><label>技能名称</label><input className="form-control" value={editingSkill.name} onChange={e => setEditingSkill({ ...editingSkill, name: e.target.value })} placeholder="例如: weather_skill" disabled={editingSkill._existing} /></div><div className="form-group"><label>描述</label><textarea className="form-control" rows={2} value={editingSkill.description} onChange={e => setEditingSkill({ ...editingSkill, description: e.target.value })} placeholder="技能功能描述" /></div><div className="form-group"><label>技能提示词（可选）</label><textarea className="form-control" rows={3} value={editingSkill.prompt || ''} onChange={e => setEditingSkill({ ...editingSkill, prompt: e.target.value })} placeholder="当用户询问天气时，请使用 get_weather 工具..." /></div><div style={{ marginTop: '12px', borderTop: '1.5px solid #e2e8f0', paddingTop: '10px' }}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '8px' }}><span style={{ fontSize: '12px', color: '#475569', fontWeight: 600 }}>工具列表 ({(editingSkill.tools || []).length})</span><button className="btn btn-sm" style={{ background: '#e2e8f0', color: '#475569' }} onClick={() => setEditingSkill({ ...editingSkill, tools: [...(editingSkill.tools || []), { name: '', description: '', url: '', method: 'GET', headers: {}, parameters: [{ name: 'query', type: 'string', description: '', required: true }] }] })}>+ 添加工具</button></div>{(editingSkill.tools || []).map((tool, tIdx) => (<div key={tIdx} style={{ padding: '10px', background: '#f8fafc', borderRadius: '8px', border: '1.5px solid #e2e8f0', marginBottom: '8px' }}><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}><span style={{ fontSize: '11px', color: '#667eea', fontWeight: 600 }}>工具 #{tIdx + 1}</span><button style={{ background: 'none', border: 'none', color: '#c62828', cursor: 'pointer', fontSize: '14px' }} onClick={() => { const tools = editingSkill.tools.filter((_, i) => i !== tIdx); setEditingSkill({ ...editingSkill, tools }); }}>×</button></div><div className="form-group"><label>工具名称</label><input className="form-control" value={tool.name} onChange={e => { const tools = [...editingSkill.tools]; tools[tIdx] = { ...tools[tIdx], name: e.target.value }; setEditingSkill({ ...editingSkill, tools }); }} placeholder="例如: get_weather" /></div><div className="form-group"><label>描述</label><textarea className="form-control" rows={2} value={tool.description} onChange={e => { const tools = [...editingSkill.tools]; tools[tIdx] = { ...tools[tIdx], description: e.target.value }; setEditingSkill({ ...editingSkill, tools }); }} placeholder="工具功能描述" /></div><div style={{ marginTop: '6px', padding: '8px', background: '#f1f5f9', borderRadius: '6px', border: '1px solid #e2e8f0' }}><div style={{ fontSize: '10px', color: '#64748b', marginBottom: '4px', fontWeight: 500 }}>API 接口配置（留空则使用内置模拟）</div><div className="form-group"><label>接口地址 (URL)</label><input className="form-control" value={tool.url || ''} onChange={e => { const tools = [...editingSkill.tools]; tools[tIdx] = { ...tools[tIdx], url: e.target.value }; setEditingSkill({ ...editingSkill, tools }); }} placeholder="https://api.example.com/weather" /></div><div style={{ display: 'flex', gap: '6px' }}><div className="form-group" style={{ flex: '0 0 90px' }}><label>请求方式</label><select className="form-control" value={tool.method || 'GET'} onChange={e => { const tools = [...editingSkill.tools]; tools[tIdx] = { ...tools[tIdx], method: e.target.value }; setEditingSkill({ ...editingSkill, tools }); }}><option value="GET">GET</option><option value="POST">POST</option></select></div><div className="form-group" style={{ flex: 1 }}><label>Headers (JSON)</label><input className="form-control" value={tool.headers ? (typeof tool.headers === 'string' ? tool.headers : JSON.stringify(tool.headers)) : ''} onChange={e => { let h = e.target.value; try { h = JSON.parse(h); } catch {} const tools = [...editingSkill.tools]; tools[tIdx] = { ...tools[tIdx], headers: h }; setEditingSkill({ ...editingSkill, tools }); }} placeholder='{"Authorization": "Bearer xxx"}' /></div></div></div><div style={{ marginTop: '8px' }}><div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: '#64748b', marginBottom: '4px' }}><span>请求参数</span><button className="btn btn-sm" style={{ background: '#e2e8f0', color: '#475569', fontSize: '10px' }} onClick={() => { const tools = [...editingSkill.tools]; tools[tIdx] = { ...tools[tIdx], parameters: [...(tools[tIdx].parameters || []), { name: '', type: 'string', description: '', required: false }] }; setEditingSkill({ ...editingSkill, tools }); }}>+ 添加参数</button></div><div className="params-header"><span className="pn">名称</span><span className="pt">类型</span><span className="pd">描述</span><span className="pr">必填</span></div>{(tool.parameters || []).map((p, pIdx) => (<div key={pIdx} className="param-row"><input className="param-name" value={p.name} onChange={e => { const tools = [...editingSkill.tools]; const params = [...tools[tIdx].parameters]; params[pIdx] = { ...params[pIdx], name: e.target.value }; tools[tIdx] = { ...tools[tIdx], parameters: params }; setEditingSkill({ ...editingSkill, tools }); }} placeholder="参数名" /><select className="param-type" value={p.type} onChange={e => { const tools = [...editingSkill.tools]; const params = [...tools[tIdx].parameters]; params[pIdx] = { ...params[pIdx], type: e.target.value }; tools[tIdx] = { ...tools[tIdx], parameters: params }; setEditingSkill({ ...editingSkill, tools }); }}><option value="string">string</option><option value="number">number</option><option value="boolean">boolean</option><option value="array">array</option></select><input className="param-desc" value={p.description} onChange={e => { const tools = [...editingSkill.tools]; const params = [...tools[tIdx].parameters]; params[pIdx] = { ...params[pIdx], description: e.target.value }; tools[tIdx] = { ...tools[tIdx], parameters: params }; setEditingSkill({ ...editingSkill, tools }); }} placeholder="描述" /><label className="param-req" style={{ cursor: 'pointer', fontSize: '11px' }}><input type="checkbox" checked={p.required} onChange={e => { const tools = [...editingSkill.tools]; const params = [...tools[tIdx].parameters]; params[pIdx] = { ...params[pIdx], required: e.target.checked }; tools[tIdx] = { ...tools[tIdx], parameters: params }; setEditingSkill({ ...editingSkill, tools }); }} /></label>{(tool.parameters || []).length > 1 && <button style={{ background: 'none', border: 'none', color: '#c62828', cursor: 'pointer', fontSize: '14px', padding: '0 4px' }} onClick={() => { const tools = [...editingSkill.tools]; const params = tools[tIdx].parameters.filter((_, i) => i !== pIdx); tools[tIdx] = { ...tools[tIdx], parameters: params }; setEditingSkill({ ...editingSkill, tools }); }}>×</button>}</div>))}</div></div>))}</div><div className="btn-group"><button className="btn btn-sm" style={{ background: '#f1f5f9', color: '#475569' }} onClick={() => setEditingSkill(null)}>取消</button><button className="btn btn-primary btn-sm" onClick={() => saveSkill(editingSkill)} disabled={!editingSkill.name}>保存</button></div></div>)}</div>)}
                                {tab === 'prompt' && (<div><div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}><span style={{ fontSize: '12px', color: '#8a9aaa' }}>系统提示词</span></div><div className="form-group"><textarea className="form-control" rows={16} value={prompt} onChange={e => setPrompt(e.target.value)} placeholder="你是一个有用的AI助手。" style={{ fontFamily: 'monospace', fontSize: '12px', lineHeight: '1.6' }} /></div><div className="btn-group"><button className="btn btn-primary" onClick={savePrompt}>💾 保存提示词</button></div></div>)}
                            </div>
                        </div>
                        <div className="chat-area">
                            <div className="chat-messages">
                                {chatMessages.length === 0 && (<div className="welcome"><h2>🤖 LangGraph Agent</h2><p>配置好左侧的模型、工具和提示词<br />在下方输入问题开始对话<br /><br /><span style={{ fontSize: '11px', color: '#3a4a6a' }}>当前: {selectedModel || '未选择模型'}{activeSkillCount > 0 ? ` · ${activeSkillCount} 个技能` : ''}</span></p></div>)}
                                {chatMessages.filter(msg => msg.role !== 'tool').map((msg, i) => {
                                    const isThinking = msg.role === 'thinking';
                                    const cls = msg.role === 'user' ? 'user' : msg.role === 'tool-start' ? 'tool-start' : isThinking ? 'thinking' : 'assistant';
                                    const label = msg.role === 'user' ? '你' : msg.role === 'tool-start' ? '工具调用' : isThinking ? '' : 'AI';
                                    const diagramUrl = msg._previewUrl || null;
                                    const formJson = msg.role === 'assistant' ? parseFormJSON(msg.content) : null;
                                    const displayContent = formJson ? stripFormJSON(msg.content) : msg.content;
                                    return (
                                    <div key={i} className={`msg ${cls}`}>
                                        {!isThinking && <div className="msg-label">{label}</div>}
                                        <div className="msg-bubble">
                                            {msg.role === 'tool-start' && !msg._completed && <span className="tool-spinner" />}
                                            {msg.role === 'tool-start' && msg._completed && <span className="tool-check">✅</span>}
                                            {displayContent}
                                            {formJson && <ArchDiagramForm formData={formJson} onSubmit={(msgText) => { setChatInput(msgText); runAgent(msgText); }} />}
                                            {diagramUrl && (<div className="diagram-container"><div className="diagram-header"><span>📊 架构图预览</span><button className="diagram-open-btn" onClick={() => window.open(diagramUrl, '_blank')}> 新窗口打开</button></div><iframe src={diagramUrl} className="diagram-iframe" title="architecture-diagram" /></div>)}
                                        </div>
                                    </div>);
                                })}
                                <div ref={chatEndRef} />
                            </div>
                            <div className="chat-input-area">
                                <div style={{ display: 'flex', gap: '8px', marginBottom: '10px', flexWrap: 'wrap', alignItems: 'center' }}>
                                    <span style={{ fontSize: '11px', color: '#64748b', fontWeight: 600 }}>模型:</span>
                                    <select style={{ padding: '5px 12px', border: '1.5px solid #e2e8f0', borderRadius: '8px', background: '#fff', color: '#1e293b', fontSize: '12px', cursor: 'pointer', fontWeight: 500, outline: 'none' }} value={selectedModelName} onChange={e => selectModel(e.target.value)}>
                                        <option value="">-- 请选择模型 --</option>
                                        {modelList.map(m => (<option key={m.name} value={m.name}>{m.name} ({m.model_name})</option>))}
                                    </select>
                                    <span style={{ fontSize: '11px', color: '#64748b', marginLeft: '6px', fontWeight: 600 }}>技能:</span>
                                    {activeSkillCount === 0 ? <span style={{ fontSize: '11px', color: '#94a3b8' }}>未开启</span> : enabledSkills.map(([name]) => (<span key={name} style={{ fontSize: '11px', padding: '3px 10px', background: '#eef2ff', borderRadius: '8px', color: '#667eea', fontWeight: 600 }}>{name}</span>))}
                                </div>
                                <div className="chat-input-row">
                                    <textarea value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyDown={handleKeyDown} placeholder={running ? '运行中...' : '输入你的问题... (Enter 发送, Shift+Enter 换行)'} disabled={running} rows={2} />
                                    <button className="chat-run-btn" onClick={runAgent} disabled={running || !chatInput.trim()}>{running ? '⏳ 运行中' : '▶ 运行'}</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    {logOpen && (<div style={{ position: 'fixed', top: 0, right: 0, bottom: 0, width: `${logWidth}px`, background: '#fff', borderLeft: '1.5px solid #e2e8f0', zIndex: 100, display: 'flex', flexDirection: 'column', boxShadow: '-8px 0 32px rgba(0,0,0,0.1)', transition: draggingRef.current ? 'none' : 'width 0.15s ease' }}><div onMouseDown={onDragStart} style={{ position: 'absolute', left: 0, top: 0, bottom: 0, width: '6px', cursor: 'col-resize', zIndex: 10, background: 'transparent' }} title="拖拽调整宽度" /><div style={{ padding: '14px 20px', borderBottom: '1.5px solid #e2e8f0', display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#f8fafc' }}><span style={{ fontWeight: 700, fontSize: '14px', color: '#1e293b' }}>📋 执行日志</span><button className="btn btn-sm" style={{ background: '#e2e8f0', color: '#475569' }} onClick={() => setLogOpen(false)}>✕ 关闭</button></div><div style={{ flex: 1, overflowY: 'auto', padding: '14px 18px', fontFamily: 'monospace', fontSize: '12px', lineHeight: '1.8', background: '#fafbfc' }}>{logs.length === 0 && <div style={{ color: '#94a3b8', textAlign: 'center', padding: '40px 0' }}><div style={{ fontSize: '28px', marginBottom: '10px' }}>📭</div><div style={{ fontWeight: 600 }}>暂无日志</div><div style={{ fontSize: '11px', marginTop: '6px' }}>运行 Agent 后将显示详细执行步骤</div></div>}{logs.map((log, i) => (<div key={i} style={{ padding: '8px 10px', marginBottom: '6px', borderRadius: '8px', background: log.level === 'error' ? '#fef2f2' : '#fff', border: `1.5px solid ${log.level === 'error' ? '#fecaca' : '#e2e8f0'}`, borderLeft: `4px solid ${log.level === 'error' ? '#dc2626' : log.step.includes('失败') ? '#dc2626' : '#667eea'}`, boxShadow: '0 1px 3px rgba(0,0,0,0.03)' }}><div style={{ display: 'flex', gap: '10px', color: '#94a3b8', fontSize: '10px', fontWeight: 600 }}><span>{log.timestamp || ''}</span><span style={{ color: log.level === 'error' ? '#dc2626' : '#667eea' }}>{log.step}</span></div><LogDetail text={log.detail} /></div>))}<div ref={logEndRef} /></div></div>)}
                    <Toast msg={toast.msg} show={toast.show} />
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
